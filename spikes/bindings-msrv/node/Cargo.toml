[package]
name = "spike-napi-msrv"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[workspace]
