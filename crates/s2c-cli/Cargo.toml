[package]
name = "shacl2cypher"
description = "Compile SHACL shapes into named Cypher diagnostic queries and validate Neo4j or LadybugDB graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["shacl", "cypher", "neo4j", "cli", "validation"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "shacl2cypher"
path = "src/main.rs"

[features]
default = []
neo4j = ["shacl2cypher-runner/neo4j"]
ladybug = ["shacl2cypher-runner/ladybug"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
shacl2cypher-core = { path = "../s2c-core", version = "0.2.0" }
shacl2cypher-runner = { path = "../s2c-runner", version = "0.2.0", features = ["remote-imports"] }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
