[package]
name = "s2c-core"
description = "SHACL to Cypher compiler core: shapes AST, mapping, IR, dialect renderers, manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oxrdf = "0.3.4"
oxttl = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
