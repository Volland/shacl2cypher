[package]
name = "shacl2cypher-core"
description = "SHACL to Cypher compiler core: shapes AST, mapping, IR, dialect renderers, manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["shacl", "cypher", "neo4j", "graph", "validation"]
categories = ["compilers", "database"]

[dependencies]
oxrdf = "0.3.4"
oxttl = "0.2.4"
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
insta = "1.48.0"
regex = "1.13.1"
tempfile = "3.27.0"
