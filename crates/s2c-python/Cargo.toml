[package]
name = "s2c-python"
description = "Python bindings for shacl2cypher (the `shacl2cypher` PyPI package)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# Linking a test harness would need libpython; the pytest suite tests this crate.
test = false
doctest = false

[features]
default = []
neo4j = ["shacl2cypher-runner/neo4j"]
ladybug = ["shacl2cypher-runner/ladybug"]
remote-imports = ["shacl2cypher-runner/remote-imports"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pythonize = "0.29"
serde_json = "1.0.151"
shacl2cypher-core = { path = "../s2c-core" }
shacl2cypher-runner = { path = "../s2c-runner" }
