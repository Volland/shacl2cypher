[package]
name = "shacl2cypher-runner"
description = "Executes shacl2cypher manifests against Neo4j, LadybugDB and FalkorDB and introspects schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["shacl", "cypher", "neo4j", "ladybugdb", "validation"]
categories = ["database", "development-tools::testing"]
# Integration tests need the repository's fixtures and the unpublished testkit.
exclude = ["tests/"]

[features]
default = []
neo4j = ["dep:neo4rs", "dep:tokio"]
ladybug = ["dep:lbug"]
falkordb = ["dep:falkordb", "dep:redis"]
remote-imports = ["dep:ureq"]

[dependencies]
# redis 1.2.3 and later need Rust 1.88; pinned with the client for the 1.87 toolchain.
falkordb = { version = "=0.10.3", optional = true }
redis = { version = "=1.2.2", optional = true, default-features = false }
lbug = { version = "0.20.4", optional = true }
neo4rs = { version = "=0.9.0-rc.10", optional = true }
ureq = { version = "2", optional = true }
shacl2cypher-core = { path = "../s2c-core", version = "0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "time", "macros"], optional = true }

[dev-dependencies]
s2c-testkit = { path = "../s2c-testkit" }
serde_yaml_ng = "0.10"
tempfile = "3.27.0"
