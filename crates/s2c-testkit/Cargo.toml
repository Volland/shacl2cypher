[package]
name = "s2c-testkit"
description = "Test-only toolkit: conformance fixtures, RDF and LPG projections, result comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# `s2c-fixture ladybug-db`: materialize fixtures into LadybugDB files.
ladybug = ["dep:lbug"]

[dependencies]
lbug = { version = "0.20.4", optional = true }
oxrdf = "0.3.4"
oxttl = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
