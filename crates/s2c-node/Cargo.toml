[package]
name = "s2c-node"
description = "Node.js bindings for shacl2cypher (the `shacl2cypher` npm package)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# Linking a test harness would need Node's symbols; `node --test` tests this crate.
test = false
doctest = false

[features]
default = []
neo4j = ["shacl2cypher-runner/neo4j"]
ladybug = ["shacl2cypher-runner/ladybug"]
remote-imports = ["shacl2cypher-runner/remote-imports"]

[dependencies]
# napi-rs releases after 3.4 need Rust 1.88.
napi = { version = ">=3.4, <3.5", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = ">=3.3, <3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shacl2cypher-core = { path = "../s2c-core" }
shacl2cypher-runner = { path = "../s2c-runner" }
tokio = { version = "1.53.1", features = ["rt", "sync"] }

[build-dependencies]
napi-build = ">=2.2.4, <2.3"
