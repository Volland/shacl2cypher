name: Release

# Pushing a `v*` tag checks that the tag matches the workspace and npm versions,
# creates a GitHub release with prebuilt `shacl2cypher` binaries (both database
# backends) and their SHA-256 checksums, and builds, smoke-tests and publishes the
# Python and Node.js packages. Packages are published only when every package
# build and smoke test passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # lbug links OpenSSL; every release artifact links this version statically.
  OPENSSL_VERSION: "3.0.15"

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace and npm package versions
        run: |
          workspace=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "shacl2cypher-core"))')
          if [ "${GITHUB_REF_NAME#v}" != "$workspace" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $workspace"
            exit 1
          fi
          node crates/s2c-node/scripts/version.js check "$workspace"

  create:
    name: Create release
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "shacl2cypher $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # lbug's C++ uses std::format, which needs macOS 13.3; ignored on Linux.
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-static-openssl
      - name: Build static OpenSSL
        shell: bash
        run: |
          scripts/ci/static-openssl.sh "$RUNNER_TEMP/openssl"
          echo "OPENSSL_DIR=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p shacl2cypher --features neo4j,ladybug,falkordb --target ${{ matrix.target }}
      - run: scripts/ci/check-no-dynamic-openssl.sh "target/${{ matrix.target }}/release/shacl2cypher"
      - name: Package
        shell: bash
        run: |
          name="shacl2cypher-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/shacl2cypher" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - run: gh release upload "$GITHUB_REF_NAME" shacl2cypher-*.tar.gz shacl2cypher-*.tar.gz.sha256
        env:
          GH_TOKEN: ${{ github.token }}

  # One job per target builds the wheel and the Node addon from one `target/`, so
  # LadybugDB's C++ is compiled once. Linux jobs run in manylinux_2_28 images so
  # both packages share the glibc 2.28 baseline.
  bindings:
    name: Bindings ${{ matrix.platform }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            node-arch: x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            node-arch: arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      NODE_VERSION: "22.12.0"
      # lbug's C++ uses std::format, which needs macOS 13.3; ignored on Linux.
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust, Python tools, cmake and Node (manylinux)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.87.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Perl modules OpenSSL's Configure needs.
          dnf install -y perl-IPC-Cmd perl-Time-Piece
          /opt/python/cp312-cp312/bin/python -m pip install maturin cmake
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${{ matrix.node-arch }}.tar.xz" | tar -xJ -C /opt
          echo "/opt/node-v${NODE_VERSION}-linux-${{ matrix.node-arch }}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        if: ${{ !matrix.container }}
        with:
          toolchain: "1.87.0"
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ !matrix.container }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install maturin
        if: ${{ !matrix.container }}
        run: python -m pip install maturin
      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings-${{ matrix.platform }}-static-openssl
      - name: Build static OpenSSL
        shell: bash
        run: |
          scripts/ci/static-openssl.sh "$RUNNER_TEMP/openssl"
          echo "OPENSSL_DIR=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"
      - name: Build the wheel
        shell: bash
        run: |
          compatibility=""
          if [ -n "${{ matrix.container }}" ]; then compatibility="--compatibility manylinux_2_28"; fi
          maturin build --release --locked -m crates/s2c-python/Cargo.toml -o dist $compatibility
      - name: Build the Node addon
        shell: bash
        working-directory: crates/s2c-node
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build the fixture tool
        shell: bash
        run: cargo build --release --locked -p s2c-testkit --features ladybug --bin s2c-fixture
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python tests/bindings/smoke.py target/release/s2c-fixture
      - name: Smoke-test the Node addon
        shell: bash
        run: node tests/bindings/smoke.js crates/s2c-node target/release/s2c-fixture
      - name: Check that no artifact loads OpenSSL dynamically
        shell: bash
        run: |
          scripts/ci/check-no-dynamic-openssl.sh \
            /tmp/smoke/lib/python3*/site-packages/shacl2cypher/_native*.so \
            "crates/s2c-node/shacl2cypher.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: crates/s2c-node/shacl2cypher.${{ matrix.platform }}.node
          if-no-files-found: error

  sdist:
    name: Python sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install maturin
      - run: maturin sdist -m crates/s2c-python/Cargo.toml -o dist
      - name: Smoke-test a compile-only source build
        env:
          MATURIN_PEP517_ARGS: --no-default-features --features remote-imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-binary shacl2cypher dist/*.tar.gz
          /tmp/smoke/bin/python tests/bindings/smoke.py --compile-only
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: [bindings, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: addons
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (platform packages first)
        working-directory: crates/s2c-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            platform=$(basename "$dir")
            cp "$GITHUB_WORKSPACE/addons/shacl2cypher.$platform.node" "$dir"
            (cd "$dir" && npm publish --provenance --access public)
          done
          npm publish --provenance --access public
