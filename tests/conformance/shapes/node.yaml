# sh:node on a relationship (`livesAt`, since LadybugDB table names are
# case-insensitive and ADDRESS would collide with Address): each failing address reports the inner rule ids in `details`.
shapes: node.ttl
graph:
  nodes:
    - {id: p1, labels: [Person]}
    - {id: p2, labels: [Person]}
    - {id: p3, labels: [Person]}
    - {id: p4, labels: [Person]}
    - {id: p5, labels: [Person]}
    - {id: a1, labels: [Address], props: {zip: "12345", city: ["Kyiv"]}}
    - {id: a2, labels: [Address], props: {zip: "12"}}
    - {id: a3, labels: [Address]}
    - {id: a4, labels: [Address], props: {zip: "123456"}}
    - {id: a5, labels: [Address], props: {zip: "54321", city: ["Lviv", "Odesa"]}}
  edges:
    - {from: p1, to: a1, pred: livesAt}
    - {from: p2, to: a2, pred: livesAt}
    - {from: p3, to: a3, pred: livesAt}
    - {from: p4, to: a4, pred: livesAt}
    - {from: p5, to: a5, pred: livesAt}
expect:
  - {rule: "ex:PersonShape/ex:livesAt/sh:node", focus: p2, details: ["ex:AddressShape/ex:zip/sh:pattern"]}
  - {rule: "ex:PersonShape/ex:livesAt/sh:node", focus: p3, details: ["ex:AddressShape/ex:zip/sh:minCount"]}
  - {rule: "ex:PersonShape/ex:livesAt/sh:node", focus: p4, details: ["ex:AddressShape/ex:zip/sh:pattern"]}
  - {rule: "ex:PersonShape/ex:livesAt/sh:node", focus: p5, details: ["ex:AddressShape/ex:city/sh:maxCount"]}
