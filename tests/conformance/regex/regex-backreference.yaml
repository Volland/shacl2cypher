# Back-references run on Neo4j; LadybugDB's RE2 cannot express them, so the
# compiler rejects them there (covered by compile tests).
shapes: regex-backreference.ttl
dialects: [neo4j]
graph:
  nodes:
    - {id: t1, labels: [Text], props: {k: "aa"}}
    - {id: t2, labels: [Text], props: {k: "ab"}}
expect:
  - {rule: "ex:TextShape/ex:k/sh:pattern", focus: t2}
