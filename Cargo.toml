[workspace]
resolver = "2"
members = [
    "crates/s2c-core",
    "crates/s2c-cli",
    "crates/s2c-runner",
    "crates/s2c-testkit",
    "crates/s2c-python",
    "crates/s2c-node",
]
exclude = ["spikes"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Volland/shacl2cypher"
homepage = "https://github.com/Volland/shacl2cypher"
